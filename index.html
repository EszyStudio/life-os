    const calculateSleepDuration = (startStr, endStr) => {
      if (!startStr || !endStr) return 7.5;
      const [sh, sm] = startStr.split(':').map(Number);
      const [eh, em] = endStr.split(':').map(Number);
      if (isNaN(sh) || isNaN(eh)) return 7.5;
      let startMins = sh * 60 + (sm || 0);
      let endMins = eh * 60 + (em || 0);
      if (endMins <= startMins) {
        endMins += 24 * 60;
      }
      return Number(((endMins - startMins) / 60).toFixed(2));
    };

                  onChange={(e) => setAccCatInput(e.target.value)}
                  className="w-full bg-zinc-100 px-3 py-2 rounded-xl text-xs font-bold"
                >
                  <option value="DEBT">🔥 負債項目 (Debt)</option>
                  <option value="SAVINGS">🌱 儲蓄帳戶 (Savings)</option>
                  <option value="CURRENTS">💧 日常活存 (Currents)</option>
                  <option value="INVESTMENT">📈 投資帳戶 (Investment)</option>
                </select>
                <input
                  type="text"
                  value={accNameInput}
                  onChange={(e) => setAccNameInput(e.target.value)}
                  placeholder="帳戶代號名稱 (如：Card A、Bank 1)"
                  className="w-full bg-zinc-100 px-3 py-2 rounded-xl text-xs"
                />
                <input
                  type="number"
                  value={accBalanceInput}
                  onChange={(e) => setAccBalanceInput(e.target.value)}
                  placeholder="當前金額 / 剩餘欠款 ($)"
                  className="w-full bg-zinc-100 px-3 py-2 rounded-xl text-xs font-mono font-bold"
                />
                {accCatInput === 'DEBT' && (
                  <div className="grid grid-cols-2 gap-2.5">
                    <input
                      type="number"
                      value={accInitDebtInput}
                      onChange={(e) => setAccInitDebtInput(e.target.value)}
                      placeholder="初始總欠款 ($)"
                      className="w-full bg-zinc-100 px-3 py-2 rounded-xl text-xs font-mono"
                    />
                    <input
                      type="number"
                      step="0.1"
                      value={accAprInput}
                      onChange={(e) => setAccAprInput(e.target.value)}
                      placeholder="年利率 APR (%)"
                      className="w-full bg-zinc-100 px-3 py-2 rounded-xl text-xs font-mono"
                    />
                  </div>
                )}
                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setShowAddAccModal(false)}
                    className="px-4 py-2 rounded-xl bg-zinc-200 text-xs font-semibold"
                  >
                    取消
                  </button>
                  <button type="submit" className="px-4 py-2 rounded-xl bg-zinc-900 text-white text-xs font-semibold">
                    新增
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
